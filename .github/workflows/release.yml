name: Build and Release Electron App (electron-builder)

on:
    push:
        branches:
            - release
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    compile:
        name: Compile (Typecheck + Vite Build)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Test IPC Serialization
              run: npm run test:ipc

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Verify release runtime contract
              run: python .github/scripts/check-runtime-contract.py

            - name: Typecheck and Build
              run: npm run build

            - name: Upload Compiled Output
              uses: actions/upload-artifact@v4
              with:
                  name: compiled-output
                  path: out/
                  retention-days: 1

    package:
        name: Package (${{ matrix.os }}-${{ matrix.arch }})
        needs: compile
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      arch: x64
                    - os: ubuntu-24.04-arm
                      arch: arm64
                    - os: windows-2022
                      arch: x64
                    - os: windows-11-arm
                      arch: arm64
                    - os: macos-latest
                      arch: x64
                    - os: macos-latest
                      arch: arm64
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Setup Python for Windows HTTP regression
              if: runner.os == 'Windows' && matrix.arch == 'x64'
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Test installed Windows filesystem HTTP routes
              if: runner.os == 'Windows' && matrix.arch == 'x64'
              timeout-minutes: 15
              shell: pwsh
              run: |
                  $terminalVersion = (Get-Content -Raw src/shared/runtime-versions.json | ConvertFrom-Json).openTerminal
                  python -m pip install --disable-pip-version-check "open-terminal==$terminalVersion"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  python -B tests/test_workspace_write_guard.py --real --real-http -v
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Test isolated website preview in Chromium
              if: runner.os == 'Windows' && matrix.arch == 'x64'
              timeout-minutes: 10
              shell: pwsh
              run: node --experimental-strip-types --test tests/workspace-preview.browser.mts

            - name: Test shipped workspace switching and conditional preview tabs
              if: runner.os == 'Windows' && matrix.arch == 'x64'
              timeout-minutes: 15
              shell: pwsh
              run: |
                  $env:OPEN_WEBUI_FRONTEND = Join-Path $env:RUNNER_TEMP 'workspace-frontend'
                  python .github/scripts/check-runtime-contract.py --frontend-output $env:OPEN_WEBUI_FRONTEND
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node --experimental-strip-types --test tests/workspace-switch.browser.mts
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Download Compiled Output
              uses: actions/download-artifact@v4
              with:
                  name: compiled-output
                  path: out/

            # ── Flatpak setup (Linux x64 only) ──
            - name: Cache Flatpak SDKs
              if: runner.os == 'Linux' && matrix.arch == 'x64'
              uses: actions/cache@v4
              with:
                  path: ~/.local/share/flatpak
                  key: flatpak-sdk-23.08-electron2-${{ runner.os }}

            - name: Install Flatpak build tools
              id: flatpak
              if: runner.os == 'Linux' && matrix.arch == 'x64'
              continue-on-error: true
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder
                  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
                  flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//23.08

            # ── Apple codesigning (macOS only) ──
            - name: Install Apple codesigning certificate
              id: apple_cert
              if: matrix.os == 'macos-latest'
              continue-on-error: true
              env:
                  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
                  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
              run: |
                  if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
                    echo "No certificate provided, will build unsigned"
                    exit 1
                  fi
                  CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
                  echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
                  security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security list-keychain -d user -s $KEYCHAIN_PATH

            # ── Platform packaging ──
            - name: Package for Windows
              id: win_build
              if: runner.os == 'Windows'
              continue-on-error: true
              run: npx electron-builder --win --${{ matrix.arch }} --publish never

            - name: Package for Windows (unsigned fallback)
              if: runner.os == 'Windows' && steps.win_build.outcome == 'failure'
              env:
                  WIN_CSC_LINK: ''
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
              run: |
                  rm -rf dist/
                  npx electron-builder --win --${{ matrix.arch }} --publish never

            - name: Package for macOS (signed + notarized)
              id: mac_build
              if: matrix.os == 'macos-latest' && steps.apple_cert.outcome == 'success'
              continue-on-error: true
              env:
                  CSC_LINK: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
                  CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: npx electron-builder --mac --${{ matrix.arch }} -c.mac.notarize=true --publish never

            - name: Package for macOS (unsigned fallback)
              if: matrix.os == 'macos-latest' && (steps.apple_cert.outcome != 'success' || steps.mac_build.outcome == 'failure')
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
              run: |
                  rm -rf dist/
                  npx electron-builder --mac --${{ matrix.arch }} --publish never

            - name: Package for Linux
              if: runner.os == 'Linux'
              run: |
                  if [ "${{ matrix.arch }}" == "arm64" ]; then
                    # ARM64: deb + AppImage only (flatpak BaseApp not available for arm64)
                    npx electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never
                  elif [ "${{ steps.flatpak.outcome }}" == "success" ]; then
                    npx electron-builder --linux --${{ matrix.arch }} --publish never
                  else
                    echo "Flatpak not available, building without flatpak"
                    npx electron-builder --linux AppImage deb snap --${{ matrix.arch }} --publish never
                  fi

            # ── Windows code signing ──
            - name: Azure Trusted Signing (Windows Only)
              if: runner.os == 'Windows'
              continue-on-error: true
              uses: azure/trusted-signing-action@v0.5.1
              with:
                  azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
                  endpoint: https://eus.codesigning.azure.net/
                  trusted-signing-account-name: open-webui
                  certificate-profile-name: open-webui
                  files-folder: dist
                  files-folder-filter: exe

            # ── Upload release artifacts ──
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-${{ matrix.arch }}
                  path: |
                      dist/*.exe
                      dist/*.dmg
                      dist/*.zip
                      dist/*.pkg
                      dist/*.deb
                      dist/*.rpm
                      dist/*.AppImage
                      dist/*.snap
                      dist/*.flatpak
                      dist/*.tar.gz
                      dist/*.blockmap
                      dist/latest*.yml
                  if-no-files-found: warn

    release:
        name: Create GitHub Release
        needs: package
        if: >-
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
            github.ref == 'refs/heads/release' &&
            !cancelled() &&
            needs.package.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  sparse-checkout: |
                      package.json
                      CHANGELOG.md
                      .github/scripts/prepare-release-assets.mjs
                  sparse-checkout-cone-mode: false

            - name: Get version from package.json
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Release version: $VERSION"

            - name: Extract changelog for this version
              id: changelog
              run: |
                  # Extract the section for the current version from CHANGELOG.md
                  VERSION="${{ steps.version.outputs.version }}"
                  # Get content between ## [VERSION] and the next ## [ heading
                  NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
                  if [ -z "$NOTES" ]; then
                    NOTES="Release v$VERSION"
                  fi
                  # Write to file to preserve multiline content
                  echo "$NOTES" > /tmp/release_notes.md
                  echo "Changelog notes:"
                  cat /tmp/release_notes.md

            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: '*-*'
                  merge-multiple: false

            - name: Install release manifest dependency
              run: |
                  RELEASE_YAML_VERSION=$(node -p "require('./package.json').devDependencies['js-yaml']")
                  npm install --no-save --ignore-scripts "js-yaml@$RELEASE_YAML_VERSION"

            - name: Stage unique release assets and reconcile update manifests
              run: node .github/scripts/prepare-release-assets.mjs

            - name: Create Release
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ steps.version.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: v${{ steps.version.outputs.version }}
                  body_path: /tmp/release_notes.md
                  draft: false
                  prerelease: ${{ contains(steps.version.outputs.version, '-') }}
                  files: release-assets/*
